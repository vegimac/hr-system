<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>OneCrew · Feedback</title>
<style>
    @font-face { font-family:'Speedee'; font-weight:300; font-display:swap; src:url('/fonts/Speedee_Lt.woff2') format('woff2'); }
    @font-face { font-family:'Speedee'; font-weight:700; font-display:swap; src:url('/fonts/Speedee_Bd.woff2') format('woff2'); }

    :root {
        --bg: #f6f3ee;
        --bg-soft: #faf8f5;
        --ink: #1a1a1a;
        --ink-soft: #5c574f;
        --muted: #8a847a;
        --line: #e4ddd2;
        --line-strong: #3f3f3f;
        --card: rgba(255,255,255,0.78);
        --card-sel: #ffffff;
        --radius: 18px;
        --shadow: 0 10px 28px rgba(60,55,48,0.07);
        --max: 420px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
        font-family: 'Speedee', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--ink);
        background:
            radial-gradient(ellipse 80% 50% at 80% -10%, rgba(60,55,48,0.06), transparent 55%),
            radial-gradient(circle at 12% 18%, rgba(255,255,255,0.75), transparent 32%),
            linear-gradient(180deg, #faf8f5 0%, #f6f3ee 48%, #f3efe8 100%);
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px max(36px, env(safe-area-inset-bottom));
    }

    /* ── Header ── */
    .header {
        position: relative;
        width: 100%;
        max-width: var(--max);
        padding: max(28px, env(safe-area-inset-top)) 0 8px;
        text-align: center;
        overflow: hidden;
    }
    .header-arch {
        position: absolute;
        right: -18%;
        top: -8px;
        width: 70%;
        max-width: 260px;
        aspect-ratio: 405 / 342;
        background: url('/img/onecrew-arch.png') center / contain no-repeat;
        filter: invert(1);
        opacity: 0.10;
        pointer-events: none;
    }
    .logo {
        position: relative;
        display: block;
        width: auto;
        max-width: 168px;
        max-height: 52px;
        margin: 0 auto 10px;
    }
    .brand-line {
        position: relative;
        width: 56px;
        height: 1px;
        margin: 0 auto 10px;
        background: linear-gradient(90deg, transparent, #c9c2b6, transparent);
    }
    .brand-url {
        position: relative;
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
    }

    /* ── Main ── */
    .shell {
        width: 100%;
        max-width: var(--max);
        margin-top: 22px;
    }
    .title {
        margin: 0 0 12px;
        font-size: clamp(26px, 7vw, 32px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.18;
        color: var(--ink);
    }
    .sub {
        margin: 0 0 14px;
        font-size: 15.5px;
        line-height: 1.55;
        color: var(--ink-soft);
        font-weight: 300;
    }
    .anon {
        margin: 0 0 8px;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.4;
    }
    .branch {
        margin: 0 0 28px;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.4;
    }
    .branch strong { font-weight: 500; color: #6e685e; }

    .q {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.35;
        color: var(--ink);
    }
    .hint {
        margin: 0 0 16px;
        font-size: 13px;
        color: var(--muted);
    }

    /* ── Selection cards ── */
    .opts { display: flex; flex-direction: column; gap: 10px; margin: 0 0 28px; }
    .opt {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 16px 16px;
        min-height: 56px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: var(--ink);
        transition: border-color .15s ease, background .15s ease, transform .08s ease, box-shadow .15s ease;
        -webkit-appearance: none;
        appearance: none;
    }
    .opt:hover { border-color: #d0c8bb; background: #fff; }
    .opt:active { transform: translateY(1px); }
    .opt:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
    }
    .opt.is-selected {
        border-color: var(--line-strong);
        background: var(--card-sel);
        box-shadow: 0 8px 22px rgba(60,55,48,0.09);
    }
    .opt.is-disabled {
        opacity: 0.42;
        pointer-events: none;
    }
    .opt-mark {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid #c8c1b6;
        background: #fff;
        display: grid;
        place-items: center;
        transition: border-color .15s ease, background .15s ease;
    }
    .opt.is-selected .opt-mark {
        border-color: var(--ink);
        background: var(--ink);
    }
    .opt.is-selected .opt-mark::after {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
    }
    .opt-label {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--ink);
    }

    /* ── Freitext ── */
    .field { margin: 0 0 28px; }
    .field-label {
        display: block;
        margin: 0 0 10px;
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ink-soft);
        line-height: 1.4;
    }
    textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        font: inherit;
        font-size: 15px;
        font-weight: 300;
        line-height: 1.5;
        color: var(--ink);
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
        transition: border-color .15s ease, background .15s ease;
    }
    textarea::placeholder { color: #a8a296; }
    textarea:focus {
        outline: none;
        border-color: #b8b0a3;
        background: #fff;
    }

    /* Manual branch pick (ohne QR) — dezent */
    .branch-pick { margin: 0 0 22px; }
    .branch-pick select {
        width: 100%;
        font: inherit;
        font-size: 14px;
        color: var(--ink-soft);
        background: rgba(255,255,255,0.65);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #9a948a 50%),
                          linear-gradient(135deg, #9a948a 50%, transparent 50%);
        background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
    }
    .branch-pick select:focus { outline: none; border-color: #b8b0a3; }

    /* ── CTA ── */
    .cta { display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
    .btn-primary {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.01em;
        border-radius: 16px;
        padding: 16px 18px;
        min-height: 54px;
        background: var(--ink);
        color: #fff;
        transition: opacity .15s ease, transform .08s ease;
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
    .btn-primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .skip {
        appearance: none;
        border: 0;
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        padding: 8px;
        text-align: center;
        text-decoration: none;
        transition: color .15s ease;
    }
    .skip:hover { color: var(--ink-soft); }
    .skip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }

    .err {
        margin: 0 0 12px;
        min-height: 0;
        font-size: 13.5px;
        color: #9a3412;
        text-align: center;
    }

    /* ── Done states ── */
    .done {
        text-align: center;
        padding: 36px 8px 20px;
    }
    .done-mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
    }
    .done-title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
    }
    .done-sub {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink-soft);
        font-weight: 300;
    }

    .hp {
        position: absolute;
        left: -9999px;
        opacity: 0;
        height: 0;
        width: 0;
        overflow: hidden;
    }

    .footer {
        margin: 40px auto 0;
        max-width: var(--max);
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a39c90;
        font-weight: 500;
    }
</style>
</head>
<body>
    <header class="header">
        <div class="header-arch" aria-hidden="true"></div>
        <img class="logo" src="/img/onecrew-logo.png?v=20260628a" alt="OneCrew">
        <div class="brand-line" aria-hidden="true"></div>
        <p class="brand-url">onecrew.ch</p>
    </header>

    <main class="shell" id="main">
        <h1 class="title">Schade, dass du weiterziehst.</h1>
        <p class="sub">Wenn du magst, sag uns kurz, was bei deinem Entscheid am meisten mitgespielt hat.</p>
        <p class="anon">Dein Feedback bleibt anonym.</p>
        <p class="branch" id="branchNote" hidden></p>

        <div class="branch-pick" id="branchPick" hidden>
            <select id="filialeSelect" aria-label="Restaurant">
                <option value="">Restaurant wählen …</option>
            </select>
        </div>

        <form id="f" novalidate>
            <h2 class="q">Was hat bei deinem Entscheid am meisten mitgespielt?</h2>
            <p class="hint">Wähle bis zu 3 Gründe.</p>

            <div class="opts" id="opts" role="group" aria-label="Gründe"></div>

            <div class="field">
                <label class="field-label" for="comment">Wenn du magst: Was sollten wir noch wissen?</label>
                <textarea id="comment" maxlength="4000" placeholder="Dein Feedback…" rows="4"></textarea>
            </div>

            <label class="hp" aria-hidden="true">Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label>

            <div class="err" id="err" role="alert"></div>

            <div class="cta">
                <button type="submit" class="btn-primary" id="go">Feedback senden</button>
                <button type="button" class="skip" id="skip">Überspringen</button>
            </div>
        </form>
    </main>

    <div class="footer">Schaub Restaurants GmbH</div>

<script>
const REASONS = [
    { code: 'NEUER_JOB',          label: 'Neuer Job' },
    { code: 'SCHULE_STUDIUM',     label: 'Schule / Studium' },
    { code: 'ZU_VIELE_EINSAETZE', label: 'Zu viele Einsätze' },
    { code: 'ZU_WENIG_EINSAETZE', label: 'Zu wenig Einsätze' },
    { code: 'PASST_NICHT_MEHR',   label: 'Es hat für mich nicht mehr gepasst' },
    { code: 'ETWAS_ANDERES',      label: 'Etwas anderes' },
];

const qs = new URLSearchParams(location.search);
let filialeCode = (qs.get('f') || '').trim();
const selected = new Set();

const optsEl = document.getElementById('opts');
optsEl.innerHTML = REASONS.map(r => `
    <button type="button" class="opt" data-code="${r.code}" aria-pressed="false">
        <span class="opt-mark" aria-hidden="true"></span>
        <span class="opt-label">${r.label}</span>
    </button>
`).join('');

function syncOpts() {
    const full = selected.size >= 3;
    optsEl.querySelectorAll('.opt').forEach(btn => {
        const on = selected.has(btn.dataset.code);
        btn.classList.toggle('is-selected', on);
        btn.classList.toggle('is-disabled', full && !on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
}

optsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.opt');
    if (!btn || btn.classList.contains('is-disabled')) return;
    const code = btn.dataset.code;
    if (selected.has(code)) selected.delete(code);
    else if (selected.size < 3) selected.add(code);
    syncOpts();
});

(async function initBranch() {
    const note = document.getElementById('branchNote');
    const pick = document.getElementById('branchPick');
    const sel = document.getElementById('filialeSelect');
    try {
        const r = await fetch('/api/exit-survey/branches');
        const list = r.ok ? await r.json() : [];
        if (filialeCode) {
            const hit = (list || []).find(b => String(b.code) === filialeCode);
            note.hidden = false;
            note.innerHTML = hit
                ? 'Zugeordnet zu: <strong>' + esc(hit.label.trim()) + '</strong>'
                : 'Zugeordnet zu: <strong>' + esc(filialeCode) + '</strong>';
            return;
        }
        pick.hidden = false;
        for (const b of (list || [])) {
            const o = document.createElement('option');
            o.value = b.code;
            o.textContent = b.label.trim();
            sel.appendChild(o);
        }
    } catch (_) {
        if (!filialeCode) pick.hidden = false;
    }
})();

function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showDone(title, sub) {
    document.getElementById('main').innerHTML = `
        <div class="done">
            <div class="done-mark" aria-hidden="true">✓</div>
            <p class="done-title">${esc(title)}</p>
            <p class="done-sub">${esc(sub)}</p>
        </div>`;
}

document.getElementById('skip').addEventListener('click', () => {
    showDone('Alles gut.', 'Danke — und alles Gute für dich.');
});

document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    const reasons = [...selected];
    const comment = (document.getElementById('comment').value || '').trim();
    const codeFromSelect = document.getElementById('filialeSelect')?.value || '';
    if (!reasons.length && !comment) {
        err.textContent = 'Wähl einen Grund oder schreib uns kurz etwas — oder überspringe.';
        return;
    }
    const dto = {
        reasons,
        comment: comment || null,
        filialeCode: filialeCode || codeFromSelect || null,
        website: document.getElementById('website').value || null,
    };
    const btn = document.getElementById('go');
    btn.disabled = true;
    try {
        const r = await fetch('/api/exit-survey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dto),
        });
        if (r.status === 429) {
            err.textContent = 'Gerade etwas zu viel — bitte später nochmals.';
            btn.disabled = false;
            return;
        }
        if (!r.ok) {
            let t = await r.text();
            try { t = JSON.parse(t).message || t; } catch (_) {}
            err.textContent = t || 'Senden hat nicht geklappt.';
            btn.disabled = false;
            return;
        }
        showDone('Danke.', 'Dein Feedback hilft uns weiter.');
    } catch (_) {
        err.textContent = 'Netzwerkfehler — bitte später nochmals.';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
